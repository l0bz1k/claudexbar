name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded pushes to a pull request don't need their own Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    # A "Release vX.Y.Z" commit only bumps the version number; the code was
    # already tested on the commit before it, and the tag's release build
    # compiles it again. Skipping it saves a macOS runner, which are scarce.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift run ClaudexBarTestRunner
